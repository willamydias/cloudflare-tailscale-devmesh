name: CI/CD - Build & Deploy Cloudflare Worker & WWW

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build, Validate & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Cloudflare Dependencies
        run: |
          cd cloudflare
          npm install --legacy-peer-deps

      - name: 🛡️ TypeScript Validation
        run: |
          cd cloudflare
          npx tsc --noEmit

      - name: 🚀 Deploy to Cloudflare Edge
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cd cloudflare
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
