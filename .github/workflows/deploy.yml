name: CI/CD - Build & Deploy Cloudflare Worker & WWW

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-test:
    name: 🔍 Lint, Typings & Nginx Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Cloudflare Worker Dependencies
        run: |
          cd cloudflare
          npm install

      - name: 🛡️ TypeScript Check
        run: |
          cd cloudflare
          npx tsc --noEmit

      - name: 🌐 Build and Validate Nginx Container
        run: |
          docker build -t devmesh-nginx-test ./nginx
          docker run --rm devmesh-nginx-test nginx -t

  deploy-cloudflare:
    name: 🚀 Deploy to Cloudflare Edge
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          cd cloudflare
          npm install

      - name: 🚀 Deploy Worker with Assets via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare'
          command: deploy
