# Mapeamento de Upstreams dos Computadores de Desenvolvimento (Tailscale IPs / MagicDNS)
upstream dev_pc1_api {
    server 100.64.0.10:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dev_pc1_auth {
    server 100.64.0.10:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dev_pc2_frontend {
    server 100.64.0.22:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dev_pc2_vite {
    server 100.64.0.22:5173 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream homelab_dbadmin {
    server 100.64.0.50:5050 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Cabeçalhos padrão para repasse transparente
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 1. Healthcheck e Status do Gateway
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"online","gateway":"nginx-tailscale-mesh","timestamp":"$time_iso8601","containers_online":4}';
    }

    # 2. Rota para API Core no Dev PC 1 (Porta 8000)
    location /api/v1/ {
        proxy_pass http://dev_pc1_api/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # Buffering para APIs
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # 3. Rota para Auth Service no Dev PC 1 (Porta 8080)
    location /auth/ {
        proxy_pass http://dev_pc1_auth/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 4. Rota para Frontend Next.js no Dev PC 2 (Porta 3000)
    location /app/ {
        proxy_pass http://dev_pc2_frontend/;
        
        # Suporte a WebSocket / Next.js Live Reload
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Rota para Vite HMR Dev Server no Dev PC 2 (Porta 5173)
    location /vite/ {
        proxy_pass http://dev_pc2_vite/;
        
        # WebSocket Upgrade total para Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 6. Rota para pgAdmin / Database Admin no Homelab (Porta 5050)
    location /db-admin/ {
        proxy_pass http://homelab_dbadmin/;
        proxy_set_header X-Script-Name /db-admin;
        proxy_redirect off;
    }

    # Páginas de Erro Amigáveis para Desenvolvimento
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
