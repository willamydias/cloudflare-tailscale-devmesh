# Nginx Core Configuration - DevMesh Tailscale Edge Gateway
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de Log Avançado (/network-101) com tempos de resposta de upstream
    log_format devmesh_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'node="$upstream_addr" ray="$http_x_cloudflare_ray"';

    access_log /var/log/nginx/access.log devmesh_combined;

    # Otimizações de Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Otimização de Buffers e Uploads de Dev
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    proxy_buffers 8 32k;
    proxy_buffer_size 64k;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Configuração de Upstream e Mapas de WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Resolver DNS do Tailscale (MagicDNS)
    resolver 100.100.100.100 valid=10s ipv6=off;

    # Incluir configurações de sites e proxies
    include /etc/nginx/conf.d/*.conf;
}
